<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BugTrack – Report Bug</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <span class="bug-icon">🐛</span>
    <span>Bug<em>Track</em></span>
  </div>
  <div class="nav-section">
    <div class="nav-label">Main</div>
    <a href="dashboard.html" class="nav-item"><span class="icon">📊</span> Dashboard</a>
    <a href="bugs.html" class="nav-item"><span class="icon">🐞</span> Bugs <span class="nav-badge">12</span></a>
    <a href="report.html" class="nav-item active"><span class="icon">➕</span> Report Bug</a>
    <a href="users.html" class="nav-item"><span class="icon">👥</span> Users</a>
  </div>
  <div class="nav-section">
    <div class="nav-label">System</div>
    <a href="#" class="nav-item"><span class="icon">🔔</span> Notifications <span class="nav-badge">3</span></a>
    <a href="#" class="nav-item"><span class="icon">⚙️</span> Settings</a>
  </div>
  <div class="sidebar-footer">
    <div class="user-info">
      <div class="user-avatar">A</div>
      <div>
        <div class="user-name">Asha D</div>
        <div class="user-role">Admin</div>
      </div>
    </div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-title">Report a Bug</div>
    <div class="topbar-actions">
      <button class="btn btn-outline" onclick="window.location.href='bugs.html'">← Back to Bugs</button>
    </div>
  </div>

  <div class="page">
    <div class="form-card">
      <h3 style="font-size:16px;margin-bottom:6px;">New Bug Report</h3>
      <p style="color:var(--muted);font-size:13px;margin-bottom:24px;">Fill in the details below to log a new bug</p>

      <div class="form-group">
        <label>Bug Title *</label>
        <input type="text" placeholder="e.g. Login page crashes on wrong password"/>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Severity *</label>
          <select>
            <option value="">Select severity</option>
            <option value="critical">🔴 Critical</option>
            <option value="high">🟠 High</option>
            <option value="medium">🟡 Medium</option>
            <option value="low">🟢 Low</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select>
            <option value="open">Open</option>
            <option value="progress">In Progress</option>
            <option value="resolved">Resolved</option>
            <option value="closed">Closed</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Project</label>
          <select>
            <option>Bug Tracking System</option>
            <option>E-Commerce Backend</option>
            <option>Student Portal</option>
          </select>
        </div>
        <div class="form-group">
          <label>Assign To</label>
          <select>
            <option>Asha D</option>
            <option>Ravi K</option>
            <option>Priya S</option>
            <option>Karan M</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Description *</label>
        <textarea placeholder="Describe the bug in detail..."></textarea>
      </div>

      <div class="form-group">
        <label>Steps to Reproduce</label>
        <textarea placeholder="1. Go to login page&#10;2. Enter wrong password&#10;3. Click submit&#10;4. App crashes"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Expected Behavior</label>
          <input type="text" placeholder="What should happen?"/>
        </div>
        <div class="form-group">
          <label>Actual Behavior</label>
          <input type="text" placeholder="What actually happened?"/>
        </div>
      </div>

      <div style="display:flex;gap:12px;margin-top:8px;">
        <button class="btn btn-primary" onclick="submitBug()">Submit Bug Report</button>
        <button class="btn btn-outline">Clear Form</button>
      </div>

      <div id="success-msg" style="display:none;margin-top:16px;padding:12px 16px;background:rgba(34,197,94,0.1);border:1px solid var(--success);border-radius:8px;color:var(--success);font-size:13px;">
        ✅ Bug reported successfully! The assigned developer has been notified.
      </div>
    </div>
  </div>
</div>

<script>
  function submitBug() {
    document.getElementById('success-msg').style.display = 'block';
    setTimeout(() => { window.location.href = 'bugs.html'; }, 2000);
  }
</script>
</body>
</html>
