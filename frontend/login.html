<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BugTrack – Login</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
    .login-logo .bug-icon { font-size: 28px; }
    .login-logo span { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
    .login-logo span em { color: var(--accent); font-style: normal; }
    .login-card h2 { font-size: 18px; color: var(--text); margin-bottom: 6px; }
    .login-card p { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input {
      width: 100%; padding: 11px 14px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 14px; outline: none;
      transition: border-color 0.2s; box-sizing: border-box;
    }
    .form-group input:focus { border-color: var(--accent); }
    .role-select { display: flex; gap: 8px; margin-bottom: 24px; }
    .role-btn {
      flex: 1; padding: 9px; border: 1px solid var(--border);
      background: var(--bg); color: var(--muted); border-radius: 8px;
      font-size: 12px; cursor: pointer; transition: all 0.2s;
    }
    .role-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(99,102,241,0.1); }
    .btn-primary {
      width: 100%; padding: 12px; background: var(--accent);
      color: #fff; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .login-footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--muted); }
    .login-footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <span class="bug-icon">🐛</span>
      <span>Bug<em>Track</em></span>
    </div>
    <h2>Welcome back</h2>
    <p>Sign in to manage your project bugs</p>

    <div class="form-group">
      <label>Email</label>
      <input type="email" placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" placeholder="••••••••"/>
    </div>

    <label style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:8px;">Role</label>
    <div class="role-select">
      <button class="role-btn active" onclick="setRole(this)">Admin</button>
      <button class="role-btn" onclick="setRole(this)">Developer</button>
      <button class="role-btn" onclick="setRole(this)">Tester</button>
    </div>

    <button class="btn-primary" onclick="window.location.href='dashboard.html'">Sign In</button>
    <div class="login-footer">Don't have an account? <a href="#">Contact Admin</a></div>
  </div>
  <script>
    function setRole(el) {
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }
  </script>
</body>
</html>
